$(document).ready(function(){

     $('#pre').click(function(){
        $('p').prepend('Hello Bir ')
     })
   
     $('#aft').click(function(){

     })

     $('#bef').click(function(){

        $('.p').before('Hello')
     })

    $('#heading').remove()

     })

        $('#heading').removeClass('bg-red-600 text-yellow-500')
     })

       $('#tgl').click(function(){
        $('#heading').toggleClass('bg-red-600 text-yellow-500')
     })
   
     $('#red').click(function(){

     })
