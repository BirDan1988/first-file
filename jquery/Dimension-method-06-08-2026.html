<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamension method</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#5B5FEF",
                        secondary: "#10B981",
                        accent: "#38BDF8",

                        gradientStart: "#5B5FEF",
                        gradientEnd: "#10B981",

                        background: "#F8FAFC",
                        paragraph: "#64748B",

                        btnPrimary: "#2563EB",
                        btnHover: "#48EBFA",

                        heading: "#0F172A",
                        cardBg: "#3D293B"
                    },

                    fontFamily: {
                        main: ["Poppins", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body>


    <div class="container mx-auto px-3 flex">
        <div class="size-[200px]  box border-2 border-gray-700 bg-green-600 px-3 py-2 my-4"></div>
        <div class="px-3 my-4">
           <label class="font-medium text-lg">Output</label><input id="output" class="text-xl text-gray-700 px-3 py-1 border border-gray-600 rounded-lg ml-3 mt-[80px]">
        </div>
        </div>

<div class="container mx-auto px-3 flex">
        <button data-type="width" class=" btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3 hover:bg-black hover:text-white">Width</button>
        <button data-type="innerWidth"  class="btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3  hover:bg-black hover:text-white">Inner Width</button>
        <button data-type="outerWidth"  class="btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3  hover:bg-black hover:text-white">Outer Width</button>
        <button data-type="height" class="btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3  hover:bg-black hover:text-white">Height</button>
        <button data-type="innerHeight" class="btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3  hover:bg-black hover:text-white">Inner Height</button>
        <button data-type="outerHeight"  class="btn text-md px-3 py-1 rounded-xl bg-zinc-200 font-medium mr-3  hover:bg-black hover:text-white">Outer Height</button>
    </div>


    <div class="container mx-auto px-3 mt-8">
        <div class="grid grid-cols-1 gap-5">
            <div class="">
            <div class="box-1 size-[150px] bg-red-500 border-4 border-black "></div>
            <div class="btns mt-3">
                <button id="ani" class="text-gray-700 bg-zinc-200 rounded-md px-3 py-2 font-medium border border-gray-800">Animation</button>
                <button id="clr" class="text-gray-700 bg-zinc-200 rounded-md px-3 py-2 font-medium border border-gray-800">clear</button>
            </div>
        </div>
    </div>
    <div class="qanda mt-8 border-2 border-gray-800 rounded-md px-3">
        <h1 id="h1" class="text-lg text-black font-semibold px-2 py-1 ">What is jQuery <button id="start" class="text-md text-gray-700 underline ml-3">Press</button> <button id="stop" class="text-md text-gray-700 underline ml-3">stop</button></h1>
        <p id="p" class="hidden text-gray-500 italic mt-1 px-2 py-2">Jquery is Libaray for javascript to make code more shorter and easy.</p>
    </div>
</div>





    <script>
        $(document).ready(function(){
         $('.btn').click(function(){
            let type = $(this).data('type')
            let result;

            if(type==='width'){
               result= $('.box').width()
              $('#output').val(result)
            }

             else if (type === 'innerWidth') {
                result = $('.box').innerWidth()
                $('#output').val(result)
            }

             else if (type === 'outerWidth') {
                result = $('.box').outerWidth()
                $('#output').val(result)
            }

            else if (type === 'height') {
                result = $('.box').height()
                $('#output').val(result)
            }

            else if (type === 'innerHeight') {
                result = $('.box').innerHeight()
                $('#output').val(result)
            }

            else if (type === 'outerHeight') {
                result = $('.box').outerHeight()
                $('#output').val(result)
            }
         })
             
         $('#ani').click(function(){
            //    $('.box-1').hide(1000)
            //    $('.box-1').queue(function(next){
            //     alert('Box Hidden Completly')
            //      next()
            //    })
              
            //    $('.box-1').show(1000)
               $('.box-1').dequeue('my')
             
         })

         $('#clr').click(function(){
            $('.box-1').clearQueue('my')
         })

         $('.box-1').queue('my',function(next){
            $(this).removeClass('bg-red-500')
           $(this).addClass('bg-orange-500')
            $(this).text('Burger is Ready')
           next()
         }).delay(3000,'my')

          $('.box-1').queue('my',function(next){
           $(this).removeClass('bg-orange-500')
           $(this).addClass('bg-green-500')
           $(this).text('Pizza is Ready')
           
           next()
         
         }).delay(3000,'my')

         $('.box-1').queue('my',function(next){
             $(this).removeClass('bg-green-500')
             $(this).addClass('bg-blue-500')
              $(this).text('Pasta is Ready')
          
            next()
         
         }).delay(3000,'my')

          $('#start').click(function(){
            $('#p').show(2000)
            $('#p').hide(2000)
             $('#p').show(2000)
            $('#p').hide(2000)
            $('#p').show(2000)
            $('#p').queue(function(){
                $(this).addClass('bg-green-500')
                next()
            })

          })

          $('#stop').click(function(){
            $('#p').finish()
          })

         

        
            

        })
         






    </script>
    
</body>
</html>
