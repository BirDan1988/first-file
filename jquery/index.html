<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Hello</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Praesentium molestias ea quia natus dignissimos voluptas earum sit repellendus, veniam tenetur, odio commodi ipsam! Unde placeat aliquid rem eius eaque ratione.</p>
    

    <button class="btnclick">Click</button>
    <button id="hide">Click</button>
    <button id="show">show</button>

    

     <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function(){
            // $('button').click(function(){
            //     $('h1').hide()
            // })

             $('.btnclick').click(function(){
                $('h1').hide()
            })

            $('#hide').click(function(){
                $('p').hide()
            })

            $('#show').click(function(){
                $('h1').show()
                $('p').show()
            })

            $('h1').click(function(){
                $(this).hide()
            })
        })
    </script>
   
</body>

</html>
