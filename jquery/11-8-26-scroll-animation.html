<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#64EEEB",
                        secondary: "#DDE6F2",
                        para: "#A0AEC0",
                        bgtag: "#0F0F0F",
                        tagborder: "1E4A66",
                        accent: "#38BDF8",

                        gradientStart: "#5B5FEF",
                        gradientEnd: "#10B981",

                        background: "#F8FAFC",
                        paragraph: "#64748B",

                        btnPrimary: "#2563EB",
                        btnHover: "#48EBFA",

                        heading: "#0F172A",
                        cardBg: "#3D293B"
                    },

                    fontFamily: {
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],
                        roboto: ['roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body>

    <h1 class="animate__animated animate__bounce text-black font-bold text-4xl text-center">Welcome to Jquery Annimation</h1>
    <span  class="animate__flipInX animate__animated text-primary bg-gray-700 text-xs md:text-md rounded-full px-2 sm:px-3 py-1 animate__delay-1s">International News</span>


    
</body>
</html>
